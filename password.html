<html>
    <head> 
        <title>modern table </title>
        <style>

           body{
            font-family: 'Courier New';
            background-color: aqua;
            font-size: medium;
           } 
           h1{
            font-size: 500%;
            font-family: 'Franklin Gothic Medium';
            text-align: center;
            color:khaki;
           }
           label{
            text-align: center;
           }
           
           </style>
        
    </head>
    <body>
        <h1>modern form</h1>
        <form action="#" method="post">
            <label for="username">username:</label>
            <input type="text" id="username" name="username"
            placeholder="enter username" required><br><br>
            <label for="email">email:</label>
            <input tpye="email" id="email" name="email"
            placeholder="enter your email" maxlength="18" required><br><br>
            <label for ="age">age:</label>
            <input type="datetime" id="age" name="age"
            placeholder="enter your age" maxlength="100" minlength="1" required><br><br>
            <label>gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label  for="male">male:</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">female:</label>
            <input type="radio" id="others" name="gender" value="others">
            <label for="others">others:</label><br><br>
            <label for="password">password:</label>
            <input type="password" id="password" name="password"
            placeholder="create password" maxlength="20" minlength="8" required><br><br>
            <label for="confirm password">confirm password:</label>
            <input type="password" id="new password" name="new password"
            placeholder="confirm password" minlength="8" maxlength="20" required><br><br>
            <button type="submit">submit:</button>
            <button type="reset">reset:</button>
        </form>
    </body>
</html>
